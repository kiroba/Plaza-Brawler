name: plaza_brawler
description: "Plaza Brawler: a 2D fighter mini-game for The Omniverse"
publish_to: 'none'
version: 5.4.0+540

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  ota_update: ^7.1.0
  omni_core_ui:
    git:
      url: https://github.com/kiroba/Omni-Core-UI.git
      ref: v0.1.1
  cryptography: ^2.7.0
  crypto: ^3.0.3
  sqflite: ^2.3.0
  path: ^1.9.0
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # Pure-Dart tests (test/*_test.dart that import package:test, e.g. game_engine_test, kiosk_test).
  test: ^1.24.0

flutter:
  uses-material-design: true
