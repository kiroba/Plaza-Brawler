name: plaza_brawler
description: "Plaza Brawler: a 2D fighter mini-game for The Omniverse"
publish_to: 'none'
version: 5.5.1+551

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  ota_update: ^7.1.0
  omni_core_ui:
    git:
      url: https://github.com/kiroba/Omni-Core-UI.git
      ref: v0.1.3
  cryptography: ^2.7.0
  crypto: ^3.0.3
  sqflite: ^2.3.0
  # Desktop runtime (D2): the FFI database factory sqflite needs on Windows/Linux/macOS, where
  # there is no platform channel. Also used by the plain-Dart tests below.
  sqflite_common_ffi: ^2.3.0
  path: ^1.9.0
  flutter_secure_storage: ^9.2.4
  # Demo-day (kiosk) mode keeps the screen on. Capped at the 1.5.x line that CI built with this repo's AGP 8.11.1
  # (run 41707160090 resolved 1.5.2). Its changelog says 1.4.0+ wants AGP >= 8.12.1, so don't float past
  # what CI has proven; newer lines move to built-in Kotlin and AGP 9 handling.
  wakelock_plus: ">=1.3.3 <1.6.0"
  # Feedback CSV export through the share sheet. Pinned to 11.x: share_plus 12.0.0+ needs AGP >= 8.12.1.
  share_plus: ^11.1.0
  # Sound effects (lib/audio/sfx_audioplayers.dart). audioplayers_android 5.3.0+ uses the AGP 9 built-in
  # Kotlin setup and needs Flutter 3.44+, so cap it at the 5.2.x line for this repo's AGP 8.11.1;
  # audioplayers 6.8+ moves to that line too.
  audioplayers: ">=6.5.1 <6.8.0"
  audioplayers_android: ">=5.2.1 <5.3.0"
  # PvP lobby QR display only (slice S1): renders the pairing payload.
  # No network, no scanning; the guest joins with the session code + IP.
  qr_flutter: ^4.1.0
  # Desktop controller (D3): gamepad input on Windows via the GameInput API. The plugin is only
  # listened to on Windows (lib/input/gamepad_bridge.dart); the Android build and behavior are
  # unchanged (no MainActivity forwarding added, no Android gamepad support claimed).
  gamepads: ^0.1.15

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # Pure-Dart tests (test/*_test.dart that import package:test, e.g. game_engine_test, kiosk_test).
  test: ^1.24.0

flutter:
  uses-material-design: true
  assets:
    # CC0 sound effects (Kenney Impact Sounds + a synthesized menu blip); see assets/sfx/CREDITS.md.
    - assets/sfx/
